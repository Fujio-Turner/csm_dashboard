services:
  csm_dashboard:
    container_name: csm-dashboard
    build:
      context: .
      args:
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    image: csm-dashboard:0.1.0
    platform: linux/amd64
    restart: unless-stopped
    ports:
      # Laptop browser :5001 → process inside the container :5000.
      # Google OAuth redirect_uri uses PUBLIC_PORT (what the browser hits).
      - "127.0.0.1:${CSM_DASHBOARD_PUBLIC_PORT:-5001}:${CSM_DASHBOARD_PORT:-5000}"
    environment:
      CSM_DASHBOARD_DB_PATH: /data/csm_dashboard.cblite2
      CSM_DASHBOARD_BIND: 0.0.0.0
      CSM_DASHBOARD_PORT: ${CSM_DASHBOARD_PORT:-5000}
      CSM_DASHBOARD_PUBLIC_PORT: ${CSM_DASHBOARD_PUBLIC_PORT:-5001}
      XAI_API_KEY: ${XAI_API_KEY:-}
      CBLITE_LIB_PATH: /opt/cblite/lib/x86_64-linux-gnu/libcblite.so
      LD_LIBRARY_PATH: /opt/cblite/lib/x86_64-linux-gnu:/opt/cblite/lib
    volumes:
      - ./data:/data
      - ./config.json:/app/config.json:ro
      - ./__local/credentials.json:/app/credentials.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/healthz' % os.environ.get('CSM_DASHBOARD_PORT','5000'))"]
      interval: 15s
      timeout: 5s
      retries: 5
